<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css" />
    <link rel="stylesheet" href="/css/about.css" />
    <title>Vertical Slider</title>
  </head>
  <body>
    <div class="slider-container">
      <div class="left-slide">
        <div style="background-color: #2938ff">
          <h1>JOIN OUR DISCORD</h1>
          <p>https://discord.polarismc.lat</p>
        </div>
        <div style="background-color: #6b9c64">
          <h1>JOIN OUR MINECRAFT SERVER</h1>
          <p>mc.polarismc.lat</p>
        </div>
        <div style="background-color: #ff0000">
          <h1>JOIN OUR YOUTUBE CHANNEL</h1>
          <p>N/A</p>
        </div>
        <div style="background-color: #FFB866">
          <h1>JOIN AND SHOP IN OUR STORE</h1>
          <p>N/A</p>
        </div>
      </div>
      <div class="right-slide">
        <div style="background-image: url('https://i.ytimg.com/vi/_H_FGJUDgmQ/maxresdefault.jpg')"></div>
        <div style="background-image: url('https://yt3.googleusercontent.com/8YREjMpJG4lXPc4oAIXZbSL6GniENWwAJIAGQ2yR3yphhJz_0XUoNoj6uMaWPevxVl721QKKnqM=s900-c-k-c0x00ffffff-no-rj')"></div>
        <div style="background-image: url('https://p4.wallpaperbetter.com/wallpaper/217/807/693/render-video-games-minecraft-wallpaper-preview.jpg')"></div>
        <div style="background-image: url('https://i.ytimg.com/vi/7V5jdOjWVU4/maxresdefault.jpg')"></div>//discord
      </div>
      <div class="action-buttons">
        <button class="down-button">
          <i class="fas fa-arrow-down"></i>
        </button>
        <button class="up-button">
          <i class="fas fa-arrow-up"></i>
        </button>
      </div>
    </div>

    <script src="about.js"></script>
  </body>
</html>
