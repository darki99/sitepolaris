<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css"
      integrity="sha512-1PKOgIY59xJ8Co8+NE6FZ+LOAZKjy+KY8iq0G4B3CyeY6wYHN3yt9PW0XpSriVlkMXe40PTKnXrLnZ9+fkDaog=="
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="testimonials.css" />
    <title>Testimonial Box</title>
  </head>
  <body>
    <div class="testimonial-container">
      <div class="progress-bar"></div>
      <div class="fas fa-quote-right fa-quote"></div>
      <div class="fas fa-quote-left fa-quote"></div>
      <p class="testimonial">
        As a discord bot I have the functionality of providing moderation commands to collaborators and providing support to users when they require help, I was developed by darkigames.
      </p>
      <div class="user">
        <img
          src="https://i.ibb.co/1GJVqLW/POLARIS.png"
          alt="user"
          class="user-image"
        />
        <div class="user-details">
          <h4 class="username">Polaris Bot</h4>
          <p class="role">Discord Bot</p>
        </div>
      </div>
    </div>
    <script src="testimonials.js"></script>
  </body>
</html>
